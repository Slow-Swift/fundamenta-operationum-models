<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundamenta Operationum Models</title>
    <style>

      [data-theme="light"] {
        --text-color: #000000;
        --stroke-color: #ffffff;
      }

      [data-theme="dark"] {
        --text-color: #ffffff;
        --stroke-color: #000000;
      }

      body { margin: 0; }

      .model-label {
        color: var(--text-color);
        text-shadow: 
          2px 0 var(--stroke-color), 
          -2px 0 var(--stroke-color), 
          0 2px var(--stroke-color), 
          0 -2px var(--stroke-color),
          1px 1px var(--stroke-color), 
          -1px -1px var(--stroke-color), 
          1px -1px var(--stroke-color), 
          -1px 1px var(--stroke-color);
      }
    </style>
  </head>
